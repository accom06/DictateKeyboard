name: Build Debug APK
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 ndk;26.1.10909125 cmake;3.22.1'

      - name: Make scripts executable
        run: |
          chmod +x gradlew
          chmod +x tools/*.sh tools/bergamot/*.sh || true

      # Download the missing native libs
      - name: Fetch Sherpa ONNX native libraries
        run: ./tools/fetch-sherpa-onnx.sh

      # Build bergamot translation engine (requires NDK + CMake from above)
      - name: Build bergamot translation engine
        run: ./tools/bergamot/build-android.sh

      - name: Build with Gradle
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dictate-debug-apk
          path: app/build/outputs/apk/debug/*.apk
